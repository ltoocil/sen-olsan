      <h1>Sen olsan ne yapardın?</h1>
      <p>Bu sayfa, gündelik bir hak anlaşmazlığında seçim yapıp aynı olayı başka bir yoldan denemek için hazırlanmış bir prototiptir. Olaylar kurgudur ve hukuki danışmanlık değildir.</p>
      <p>Oyunun dallanması bu tarayıcıda JavaScript ile çalışır. Sayfa bir sunucuya veri göndermez, dosya yüklemez ve üyelik istemez. JavaScript kapalıyken kartlar seçilemez.</p>
      <h2>Üç kurgu senaryo</h2>
      <p><strong>Kayıt açık mı, söz açık mı?</strong> Dernek sekreteri Deniz, evden izleyen üye Leyla’nın bilgi hakkı ile kaydedilmek istemeyen şoför Emre’nin mahremiyeti arasında karar verir.</p>
      <p><strong>Konuşmacı gelsin mi?</strong> Kulüp başkanı Ece, tartışmalı bir konuşmacının konuşma hakkı ile ona itiraz eden öğrencilerin itiraz hakkını birlikte korumaya çalışır.</p>
      <p><strong>Cumartesi salonu kimin?</strong> Rezervasyon sorumlusu Nilüfer, eski ve kalabalık bir takım ile yeni kurulan bir takım arasında salonu eşit dağıtmaya çalışır.</p>
